# Configuration A: "The Downtown Crush"
#
# Goal: Test raw throughput and the sheer power of bundling under intense,
# concentrated demand. This will create the biggest gap between bundling and
# non-bundling algorithms.
#
# Expected Visual Outcome:
# - Greedy/Hungarian: Chaotic web of crisscrossing lines, many expired orders
# - Simple Bundling: STAR PERFORMANCE - thick efficient bundle routes clearing backlog

scenario:
  name: "downtown_crush"
  description: "Intense concentrated demand to test bundling power"
  duration_hours: 3
  random_seed: 42

# Fixed physics parameters (same across all scenarios)
physics:
  map_size_m: 5000
  distance_metric: "manhattan"
  courier_speed_kmh: 30
  pickup_service_time_s: 90
  dropoff_service_time_s: 45
  meal_prep_time_s: 300  # 5 minutes
  order_expiration_minutes: 30
  batch_interval_s: 60  # 1 minute

# Restaurant configuration
restaurants:
  count: 6  # Reduced from 8 for computational tractability
  layout: "clustered"

  # Clustered layout parameters
  clustered:
    downtown_fraction: 0.75  # 4.5 of 6 restaurants in downtown (75%)
    downtown_center: [1.25, 1.25]  # Bottom-left quadrant
    downtown_radius: 0.6  # Tight cluster

# Courier configuration
couriers:
  count: 10  # Reduced from 12 for computational tractability
  layout: "central"

  # Central layout parameters
  central:
    center: [2.0, 1.5]  # Southern quadrants
    scatter_radius: 1.0  # Spread across southern half

# Demand configuration
demand:
  total_orders: 200  # Reduced from 400 for computational tractability
  profile: "sustained_peak"

  # Sustained peak parameters
  sustained_peak:
    peak_duration_hours: 2.0  # Massive 2-hour dinner rush
    peak_start_hour: 0.5  # Starts at 30 minutes
    peak_restaurant_weight: 0.9  # 90% of orders at downtown cluster
    off_peak_rate: 0.5  # orders/min (light outside peak)
    peak_rate: 3.0  # orders/min (intense during peak)

# Algorithm configuration
algorithms:
  bundling:
    max_bundle_size: 3

  anticipated:
    lookahead_window_s: 900  # 15 minutes
    alpha_penalty: 0.5
    beta_penalty: 0.3

# Visualization
visualization:
  frames: 180  # 3 hours at 1-min intervals = 180 frames
  fps: 2
  sample_interval_s: 60

  features:
    show_downtown_box: true  # Highlight the downtown cluster
    show_river: false
    show_burst_indicator: false

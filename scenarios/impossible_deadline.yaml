# Configuration D: "The Impossible Deadline"
#
# Goal: Create a scenario that can ONLY be solved with foresight.
# This is a logistical trap where any reactive algorithm will fail by design.
#
# The Setup: One order with such a tight delivery window that waiting for it to
# be ready before dispatching will cause failure. Only Anticipated Bundling's
# proactive dispatch can succeed.

scenario:
  name: "impossible_deadline"
  description: "Logistical trap requiring foresight to solve"
  duration_hours: 1
  random_seed: 42

# Fixed physics parameters
physics:
  map_size_m: 5000
  distance_metric: "manhattan"
  courier_speed_kmh: 20  # 20 km/h for precise timing
  pickup_service_time_s: 150
  dropoff_service_time_s: 120
  meal_prep_time_s: 600  # 10 minutes
  order_expiration_minutes: 20  # 20 minutes from ready time
  batch_interval_s: 60  # 1 minute

# Single restaurant at specific location
restaurants:
  count: 1
  layout: "explicit"
  locations:
    - [4.0, 3.0]  # Restaurant at (4, 3) km

# Single courier at specific location
couriers:
  count: 1
  layout: "explicit"
  locations:
    - [3.0, 2.0]  # Courier starts at (3, 2) km

# Single critical order
demand:
  total_orders: 1
  profile: "manual"

  manual:
    orders:
      - restaurant_index: 0
        customer_location: [8.0, 6.0]  # Far customer at (8, 6) km
        placement_time: 300  # Placed at 5 minutes
        meal_prep_time: 600  # Ready at 900s (15 minutes)
        # The trap: expiration_minutes = 20 from ready_time
        # Deadline = 900 + 1200 = 2100s
        # Reactive dispatch at t=900 → delivery at t=2205s → FAIL
        # Anticipated dispatch at t=300 → delivery at t=1950s → SUCCESS

# Algorithm configuration
algorithms:
  bundling:
    max_bundle_size: 3

  anticipated:
    lookahead_window_s: 900  # 15 minutes (must see order at t=300)
    alpha_penalty: 0.1  # Low penalty for courier waiting
    beta_penalty: 0.15  # Low penalty for food waiting

# Visualization
visualization:
  frames: 60  # 1 hour at 1-min intervals = 60 frames
  fps: 2
  sample_interval_s: 60

  features:
    show_downtown_box: false
    show_river: false
    show_burst_indicator: false
